# Test Manifests for Kyverno Policy Enforcement
# Anggota 6: QA & Policy Auditor
# Purpose: Test pemblokiran Kyverno pada kontainer ilegal (root user / no resource limits)

---
# TEST 1: Pod dengan root user (akan diblokir oleh policy runAsNonRoot)
apiVersion: v1
kind: Pod
metadata:
  name: test-illegal-pod-root-user
  namespace: taskflow-prod
spec:
  containers:
  - name: nginx-root
    image: fikriau/taskflow-api:stable
    securityContext:
      runAsUser: 0  # ROOT USER - Harus diblokir
      runAsNonRoot: false
    ports:
    - containerPort: 8080
  restartPolicy: Never

---
# TEST 2: Pod tanpa resource limits (akan diblokir oleh policy resource limits)
apiVersion: v1
kind: Pod
metadata:
  name: test-illegal-pod-no-limits
  namespace: taskflow-prod
spec:
  containers:
  - name: app-no-limits
    image: fikriau/taskflow-api:stable
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    # Tidak ada resources defined - Harus diblokir
    ports:
    - containerPort: 8080
  restartPolicy: Never

---
# TEST 3: Pod dari registry yang tidak diizinkan (akan diblokir oleh policy image registry)
apiVersion: v1
kind: Pod
metadata:
  name: test-illegal-pod-untrusted-registry
  namespace: taskflow-prod
spec:
  containers:
  - name: nginx-public
    image: attacker.io/malware:latest  # Public registry - Harus diblokir
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ports:
    - containerPort: 80
  restartPolicy: Never

---
# TEST 4: Pod yang COMPLIANT (akan lolos semua policy)
apiVersion: v1
kind: Pod
metadata:
  name: test-compliant-pod
  namespace: taskflow-prod
spec:
  containers:
  - name: app-compliant
    image: fikriau/taskflow-api:stable  # Trusted registry
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ports:
    - containerPort: 8080
  restartPolicy: Never

---
# TEST 5: Deployment dengan root user (akan diblokir)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-illegal-deployment-root
  namespace: taskflow-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-root
  template:
    metadata:
      labels:
        app: test-root
    spec:
      containers:
      - name: app
        image: fikriau/taskflow-api:stable
        securityContext:
          runAsUser: 0  # ROOT - Harus diblokir
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

---
# TEST 6: Deployment yang COMPLIANT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-compliant-deployment
  namespace: taskflow-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-compliant
  template:
    metadata:
      labels:
        app: test-compliant
    spec:
      containers:
      - name: app
        image: fikriau/taskflow-api:stable  # Trusted registry
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
